name: Build Brunt Control v1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Descomprimir app
        run: unzip -o BruntControl_v1.zip -d android-project

      - name: Compilar APK
        working-directory: android-project/BruntControl_v1
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: BruntControl-APK
          path: android-project/BruntControl_v1/app/build/outputs/apk/debug/app-debug.apk
